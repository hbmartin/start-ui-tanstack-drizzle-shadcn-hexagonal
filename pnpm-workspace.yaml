packages:
  - tools/*

engineStrict: true
sideEffectsCache: false
# Refuse npm versions published less than 24h ago — the window in which most
# compromised releases (e.g. Shai-Hulud-style worms) are detected and unpublished.
minimumReleaseAge: 1440

overrides:
  '@types/node': ^24
  body-parser: 1.20.6
  'brace-expansion@2.1.1': 2.1.4
  'brace-expansion@5.0.6': 5.0.9
  esbuild: 0.28.2
  effect: 3.21.2
  fast-uri: 3.1.5
  # PR #40, 2026-05-27: keep toolchain consumers on a known-good current glob 13 release.
  # Re-evaluate after the next dependency compatibility pass confirms the override is no longer needed.
  glob: 13.0.6
  http-proxy-middleware: 3.0.7
  js-yaml: 4.3.1
  # better-auth 1.6.13 advertises kysely 0.29 support, but its kysely adapter
  # still imports root migration constants removed at runtime in kysely 0.29.
  kysely: 0.28.17
  launch-editor: 2.14.1
  nanoid: 3.3.18
  postcss: 8.5.26
  protobufjs: 7.6.5
  qs: 6.15.2
  shell-quote: 1.10.0
  socket.io-parser: 4.2.7
  svgo: 4.0.2
  undici: 7.29.0

packageExtensions:
  '@stryker-mutator/core@10.0.0':
    dependencies:
      typescript: npm:@typescript/typescript6@6.0.2

peerDependencyRules:
  allowedVersions:
    '@tanstack/zod-adapter>zod': '4'

allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@tailwindcss/oxide': true
  bufferutil: false
  cpu-features: false
  esbuild: true
  lefthook: true
  protobufjs: false
  sharp: true
  ssh2: false
  workerd: true
