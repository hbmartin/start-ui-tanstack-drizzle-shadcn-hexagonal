name: JiTTest

on:
  workflow_dispatch:
    inputs:
      base-sha:
        description: Full reviewed parent commit SHA.
        required: true
      head-sha:
        description: Full reviewed child commit SHA.
        required: true
      secret-name:
        description: Release-environment OpenRouter credential.
        type: choice
        required: true
        default: OPENROUTER_API_KEY
        options:
          - OPENROUTER_API_KEY

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jittest:
    name: Catching JiTTest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release-jittest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: 24
          pnpm-version: 11.9.0

      - name: Validate policy provenance
        env:
          JITTEST_SANDBOX_READY: ${{ vars.JITTEST_SANDBOX_READY }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "JiTTest release evidence must use the default-branch policy." >&2
            exit 1
          fi
          if [ "${JITTEST_SANDBOX_READY}" != "true" ]; then
            echo "JiTTest release execution remains disabled until its isolated runner is attested." >&2
            exit 1
          fi

      - name: Run JiTTest
        id: run
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_SECRET_NAME: ${{ inputs['secret-name'] || 'OPENROUTER_API_KEY' }}
          DISPATCH_BASE_SHA: ${{ inputs['base-sha'] }}
          DISPATCH_HEAD_SHA: ${{ inputs['head-sha'] }}
        run: |
          set -euo pipefail

          if [ "${OPENROUTER_SECRET_NAME}" != "OPENROUTER_API_KEY" ]; then
            echo "Unsupported JiTTest secret selection." >&2
            exit 1
          fi
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "OPENROUTER_API_KEY is required from the release-jittest environment." >&2
            exit 1
          fi

          mkdir -p .jittest

          BASE_SHA="${DISPATCH_BASE_SHA}"
          HEAD_SHA="${DISPATCH_HEAD_SHA}"

          sha_pattern='^[a-f0-9]{40}$'
          if [[ ! "${BASE_SHA}" =~ ${sha_pattern} ]] || [[ ! "${HEAD_SHA}" =~ ${sha_pattern} ]]; then
            echo "JiTTest requires full lowercase commit SHAs." >&2
            exit 1
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          git merge-base --is-ancestor "${BASE_SHA}" "${HEAD_SHA}"

          CONFIG_SHA="$(sha256sum jittest.config.json | cut -d ' ' -f 1)"
          POLICY_SHA="$(git rev-parse HEAD)"
          export BASE_SHA HEAD_SHA CONFIG_SHA POLICY_SHA
          node scripts/write-jittest-run-metadata.mjs
          echo "head_sha=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"

          args=(
            --config jittest.config.json
            --output console
            --base "${BASE_SHA}"
            --head "${HEAD_SHA}"
            --json-file .jittest/report.json
            --summary-file "${GITHUB_STEP_SUMMARY}"
            --comment-file .jittest/comment.md
            --feedback-path .jittest/assessment-records.jsonl
            --workflow both
            --report-threshold -1
            --flake-guard-runs 3
            --max-cost-usd 5
            --max-tokens 200000
            --llm-model anthropic/claude-sonnet-4
            --fail-on likely-strong
          )

          set +e
          env \
            -u LLM_API_KEY \
            -u LLM_PROVIDER \
            -u LLM_BASE_URL \
            -u LLM_MODEL \
            -u OPENROUTER_MODEL \
            node --import=./scripts/jittest-child-env-preload.mjs \
              node_modules/catching-jit-tests-vitest/dist/cli.js \
              catch "${args[@]}" --llm-provider openrouter
          exit_code=$?
          set -e

          node scripts/check-jittest-report.mjs \
            --config jittest.config.json \
            --report .jittest/report.json \
            --triage docs/jittest-triage.json \
            --cli-exit "${exit_code}" \
            --base-sha "${BASE_SHA}" \
            --head-sha "${HEAD_SHA}" \
            --release

      - name: Upload JiTTest artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jittest-report-${{ steps.run.outputs.head_sha }}-${{ github.run_attempt }}
          path: |
            .jittest/report.json
            .jittest/comment.md
            .jittest/assessment-records.jsonl
            .jittest/run-metadata.json
          if-no-files-found: error
          retention-days: 90
