# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/analysis-parameters

# Exclude tests and stories files from analysis
sonar.exclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/*.stories.tsx,**/*.gen.ts

# Keep generated/immutable output and adversarial emitted-artifact fixtures out
# of copy-paste detection without hiding them from the other analyzers.
sonar.cpd.exclusions=tests/**,src/routeTree.gen.ts,src/platform/components/icons/generated/**,drizzle/migrations/**
