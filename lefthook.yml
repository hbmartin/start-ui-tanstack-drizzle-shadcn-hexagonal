pre-commit:
  commands:
    format:
      run: pnpm format:changed -- {staged_files}
      stage_fixed: true
      glob: '*.{js,ts,cjs,mjs,jsx,tsx,json,css}'
      exclude:
        - '.agents/**'
        - '.claude/**'
        - '.codex/**'
    lint:
      glob: '*.{js,ts,cjs,mjs,jsx,tsx}'
      exclude:
        - '.agents/**'
        - '.claude/**'
        - '.codex/**'
      run: pnpm oxlint --deny-warnings {staged_files}
